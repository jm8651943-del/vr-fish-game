<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>VR FISH GAME // Abyss Arena</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#020817;color:#dff;font-family:system-ui}#hud{position:fixed;z-index:5;top:16px;left:16px;background:#031527dd;border:1px solid #21d4fd66;border-radius:16px;padding:12px 16px}#title{font-weight:900;letter-spacing:.15em;color:#6ff}#msg{font-size:12px;opacity:.8;margin-top:5px}#vr{position:fixed;z-index:8;right:20px;bottom:20px;border:0;border-radius:999px;padding:16px 24px;font-weight:900;font-size:16px;background:linear-gradient(135deg,#00e5ff,#7c4dff);color:#001018;box-shadow:0 0 30px #00e5ff66}canvas{display:block;width:100%;height:100%}</style></head><body>
<div id="hud"><div id="title">VR FISH GAME // ABYSS ARENA</div><div>Score <b id="score">0</b> · Shots <b id="shots">0</b> · Catches <b id="catches">0</b></div><div id="msg">Desktop: click fish. Quest: ENTER VR, aim Touch controller, pull trigger.</div></div><button id="vr">ENTER VR</button><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('#c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.xr.enabled=true;renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x011529);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03263a,.035);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.position.set(0,1.6,3.5);
scene.add(new THREE.HemisphereLight(0x77ddff,0x001018,2.2));const sun=new THREE.DirectionalLight(0x8fffff,2);sun.position.set(3,8,2);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60,30,30),new THREE.MeshStandardMaterial({color:0x07384b,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;scene.add(floor);
for(let i=0;i<180;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.018+Math.random()*.035,6,6),new THREE.MeshBasicMaterial({color:0x75efff,transparent:true,opacity:.35}));b.position.set((Math.random()-.5)*22,-2+Math.random()*9,-Math.random()*35);b.userData.bubble=1;scene.add(b)}
let score=0,shots=0,catches=0;const fishes=[],colors=[0x00e5ff,0xff4fd8,0xffd54f,0x7cff6b,0x9b7bff,0xff7043];
function fish(){const g=new THREE.Group(),col=colors[Math.floor(Math.random()*colors.length)],mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.18,roughness:.35});const body=new THREE.Mesh(new THREE.SphereGeometry(.35,14,10),mat);body.scale.set(1.7,.8,.55);g.add(body);const tail=new THREE.Mesh(new THREE.ConeGeometry(.28,.55,3),mat);tail.rotation.z=Math.PI/2;tail.position.x=-.65;g.add(tail);const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));eye.position.set(.46,.12,.17);g.add(eye);g.position.set((Math.random()-.5)*12,-1+Math.random()*5,-4-Math.random()*22);g.userData={fish:1,hp:1+Math.floor(Math.random()*4),value:10+Math.floor(Math.random()*9)*10,v:.3+Math.random()*.7,dir:Math.random()>.5?1:-1};g.scale.x*=g.userData.dir;scene.add(g);fishes.push(g)}for(let i=0;i<34;i++)fish();
const ray=new THREE.Raycaster();function beam(o,d){const geo=new THREE.BufferGeometry().setFromPoints([o,o.clone().add(d.clone().multiplyScalar(30))]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x66ffff,transparent:true,opacity:.9}));scene.add(line);setTimeout(()=>scene.remove(line),70)}
function fire(o,d){shots++;document.querySelector('#shots').textContent=shots;beam(o,d);ray.set(o,d);const hit=ray.intersectObjects(fishes,true)[0];if(!hit)return;let f=hit.object;while(f.parent&&!f.userData.fish)f=f.parent;if(!f.userData.fish)return;f.userData.hp--;if(f.userData.hp<=0){score+=f.userData.value;catches++;document.querySelector('#score').textContent=score;document.querySelector('#catches').textContent=catches;scene.remove(f);fishes.splice(fishes.indexOf(f),1);setTimeout(fish,250)}}
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);scene.add(c);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-12)]),new THREE.LineBasicMaterial({color:i?0xff55dd:0x55ffff}));c.add(line);c.addEventListener('selectstart',()=>{const o=new THREE.Vector3(),q=new THREE.Quaternion(),d=new THREE.Vector3(0,0,-1);c.getWorldPosition(o);c.getWorldQuaternion(q);d.applyQuaternion(q);fire(o,d)})}
document.querySelector('#vr').onclick=async()=>{if(!navigator.xr)return alert('Open this page in Meta Quest Browser for WebXR.');const ok=await navigator.xr.isSessionSupported('immersive-vr');if(!ok)return alert('Immersive VR unavailable on this device.');const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});renderer.xr.setSession(s)};
const mouse=new THREE.Vector2();addEventListener('pointerdown',e=>{if(renderer.xr.isPresenting)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);fire(ray.ray.origin.clone(),ray.ray.direction.clone())});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.04),t=performance.now()/1000;fishes.forEach((f,i)=>{f.position.x+=f.userData.dir*f.userData.v*dt;f.position.y+=Math.sin(t*1.3+i)*.0025;if(Math.abs(f.position.x)>8){f.userData.dir*=-1;f.scale.x*=-1}});scene.children.forEach(o=>{if(o.userData.bubble){o.position.y+=dt*.25;if(o.position.y>6)o.position.y=-2}});renderer.render(scene,camera)});
</script></body></html>
